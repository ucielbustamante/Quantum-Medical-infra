services:
  db:
    image: postgres:13
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres-config:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=1GB
      -c max_worker_processes=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:13
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      bash -c "
        until pg_isready -h db -U ${DB_USER}; do sleep 1; done;
        psql -h db -U ${DB_USER} -d ${DB_NAME} -f /docker-entrypoint-initdb.d/01_init_test_db.sql
      "
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    restart: "no"

  backend:
    build:
      context: ../Quantum-Medical-backend
    working_dir: /app
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_DIALECT: postgres
      DB_PORT: ${DB_PORT}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      RUN_SEEDERS: ${RUN_SEEDERS}
    volumes:
      - ../Quantum-Medical-backend:/app
      - /app/node_modules
      - ../Quantum-Medical-backend/logs:/app/logs
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/hello"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ../Quantum-Medical-frontend
    working_dir: /app
    env_file: .env
    environment:
      VITE_API_URL: ${VITE_API_URL}
      REACT_APP_API_URL: ${REACT_APP_API_URL}
    volumes:
      - ../Quantum-Medical-frontend:/app
      - /app/node_modules
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  loki:
    image: grafana/loki:2.9.3
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml
      - ./loki-data:/loki
    command: -config.file=/etc/loki/local-config.yml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.3
    volumes:
      - ../Quantum-Medical-backend/logs:/var/log/app
      - ../Quantum-Medical-backend/logs:/app/logs
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - backend
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"
    env_file: .env
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/files
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui
    ports:
      - "8080:8080"
    environment:
      - SWAGGER_JSON=/usr/share/nginx/html/docs/openapi.json
      - URLS_PRIMARY_NAME=Quantum Medical API
    volumes:
      - ./swagger/openapi.json:/usr/share/nginx/html/docs/openapi.json:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  grafana-storage:
  pgadmin-data:
